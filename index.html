<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeezik Maps — anteprima</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c2e; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  :root { --dock: 84px; --pink: #ff8ee0; --panel: rgba(12, 13, 40, 0.94); }
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: var(--dock); }
  .panel { position: absolute; background: var(--panel); border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .hidden { display: none !important; }

  /* Barra app stile CarPlay */
  #dock { position: absolute; top: 0; bottom: 0; left: 0; width: var(--dock); background: #07081f; display: flex; flex-direction: column; align-items: center; padding: 12px 0; box-sizing: border-box; gap: 12px; z-index: 2; }
  #clock { background: #ff7a2f; color: #fff; font-weight: 700; font-size: 15px; padding: 3px 9px; border-radius: 999px; }
  #status { font-size: 12px; font-weight: 600; color: #e6e6ff; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .bars i { width: 3px; background: #fff; border-radius: 1px; }
  .batt { width: 24px; height: 11px; border: 1.5px solid #ddd; border-radius: 3px; position: relative; }
  .batt::after { content: ''; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 45%; background: #fff; border-radius: 1px; }
  .app { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; position: relative; cursor: pointer; }
  .app svg { width: 30px; height: 30px; }
  .app.active::before { content: ''; position: absolute; left: -12px; width: 4px; height: 26px; border-radius: 2px; background: var(--pink); }
  .badge { position: absolute; top: -3px; right: -3px; width: 13px; height: 13px; border-radius: 50%; background: #ff3b30; border: 2px solid #07081f; }
  #grid { margin-top: auto; width: 30px; height: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
  #grid i { background: #fff; border-radius: 2px; }

  /* Limite e velocità */
  #speed { position: absolute; top: 20px; right: 20px; width: 118px; height: 92px; z-index: 3; }
  #limit { position: absolute; left: 0; top: 0; width: 58px; height: 58px; border-radius: 50%; background: #fff; border: 6px solid #e5222a; box-sizing: border-box; color: #111; font-weight: 800; font-size: 22px; display: grid; place-items: center; z-index: 1; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #limit.est { border-style: dashed; }
  #cur { position: absolute; right: 0; bottom: 0; width: 82px; height: 82px; border-radius: 50%; background: var(--panel); border: 3px solid #fff; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); transition: border-color .3s; }
  #cur b { font-size: 30px; line-height: 1; }
  #cur span { font-size: 12px; color: #c9c8ee; }
  #cur.over { border-color: #e5222a; }
  #cur.over b { color: #ff6a70; }
  #overGlow { position: absolute; top: 0; right: 0; bottom: 0; left: var(--dock); pointer-events: none; opacity: 0; transition: opacity .4s; box-shadow: inset 0 0 70px 14px rgba(255, 30, 45, .85), inset 0 0 0 3px rgba(255, 60, 70, .9); z-index: 1; }
  #overGlow.on { opacity: 1; animation: overPulse 1s ease-in-out infinite alternate; }
  @keyframes overPulse { from { opacity: .55; } to { opacity: 1; } }

  /* Pulsanti rotondi a destra */
  #side { position: absolute; right: 20px; top: 126px; display: flex; flex-direction: column; gap: 10px; z-index: 3; }
  .icon-btn { width: 50px; height: 50px; padding: 0; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,142,224,.55); }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn.on { background: #3a2470; border-color: var(--pink); }

  /* Riquadro manovre */
  #guide { top: 20px; left: calc(var(--dock) + 20px); width: min(420px, calc(100% - var(--dock) - 170px)); padding: 20px 24px; z-index: 3; }
  #guide .row { display: flex; align-items: center; gap: 18px; }
  #arrow { font-size: 54px; line-height: 1; font-weight: 700; width: 60px; text-align: center; }
  #dist { font-size: 36px; font-weight: 700; }
  #instr { margin-top: 10px; font-size: 24px; font-weight: 700; line-height: 1.25; }
  #then { margin: 14px -24px -20px; padding: 10px 24px; border-top: 1px solid rgba(255,255,255,.12); font-size: 16px; color: #d9d7ff; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.04); border-radius: 0 0 22px 22px; }
  #then b { font-size: 22px; }
  #guide.empty #arrow, #guide.empty #dist, #guide.empty #then { display: none; }
  #guide.empty #instr { margin: 0; }
  #searchHere { margin-top: 12px; }
  #guide:not(.empty) #searchHere { display: none; }

  /* Avvisi (autovelox, ZTL, ricalcolo) */
  #alerts { position: absolute; left: calc(var(--dock) + 20px); top: 0; display: flex; flex-direction: column; gap: 8px; z-index: 3; width: min(420px, calc(100% - var(--dock) - 170px)); }
  .alert { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px; font-weight: 700; font-size: 16px; background: var(--panel); box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: pop .3s ease-out; }
  .alert .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; flex: none; }
  .alert.cam .ic { background: #fff; color: #e5222a; }
  .alert.ztl .ic { background: #e5222a; color: #fff; font-size: 11px; font-weight: 900; }
  .alert.info .ic { background: #3a2470; }
  .alert small { display: block; font-weight: 500; color: #c9c8ee; font-size: 13px; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

  #eta { bottom: 20px; left: calc(var(--dock) + 20px); display: flex; padding: 14px 10px; z-index: 3; }
  #eta div { text-align: center; padding: 0 22px; }
  #eta b { display: block; font-size: 24px; }
  #eta span { font-size: 16px; color: #c9c8ee; }
  #controls { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px; z-index: 3; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
  button { background: var(--panel); color: #fff; border: 1px solid var(--pink); border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:hover { background: #2a1e5a; }
  button.primary { background: linear-gradient(135deg, #ff8ee0, #9b5cff); border: none; }

  /* Indicatori di posizione */
  .puck { width: 34px; height: 34px; display: grid; place-items: center; }
  .puck svg { width: 100%; height: 100%; overflow: visible; }

  /* Fogli (ricerca, impostazioni, arrivo) */
  .sheet { position: absolute; inset: 0; background: rgba(5, 6, 25, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; z-index: 20; padding: 20px; box-sizing: border-box; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; background: #0e1035; border-radius: 24px; padding: 18px; box-sizing: border-box; box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid rgba(255,142,224,.2); }
  .card h3 { margin: 6px 4px 12px; font-size: 15px; color: #c9c8ee; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .search-top { display: flex; gap: 10px; }
  #q { flex: 1; background: #1b1e52; border: 1px solid #3a3d8a; color: #fff; border-radius: 14px; padding: 14px 16px; font-size: 17px; outline: none; font-family: inherit; }
  #q:focus { border-color: var(--pink); }
  #favs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: #1b1e52; border: 1px solid #3a3d8a; padding: 9px 12px; border-radius: 999px; font-size: 15px; cursor: pointer; }
  .chip.unset { border-style: dashed; color: #c9c8ee; }
  .chip .x { margin-left: 2px; opacity: .55; font-size: 13px; padding: 0 2px; }
  #results { margin-top: 8px; }
  .res { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,.07); cursor: pointer; border-radius: 12px; }
  .res:hover { background: rgba(255,255,255,.04); }
  .res .pin { width: 34px; height: 34px; border-radius: 50%; background: #2a2d6a; display: grid; place-items: center; flex: none; }
  .res .txt { flex: 1; min-width: 0; }
  .res .txt div { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .txt small { color: #a9a8d8; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .save { background: none; border: 1px solid #3a3d8a; padding: 7px 10px; font-size: 13px; }
  .savemenu { display: flex; gap: 6px; }
  .savemenu button { padding: 7px 10px; font-size: 13px; }
  .muted { color: #a9a8d8; font-size: 14px; padding: 10px 8px; }

  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .opt { background: #1b1e52; border: 2px solid transparent; border-radius: 16px; padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .opt.sel { border-color: var(--pink); background: #2a1e5a; }
  .opt .prev { width: 44px; height: 44px; display: grid; place-items: center; }
  .opt .prev svg { width: 40px; height: 40px; overflow: visible; }
  .seg { display: flex; background: #1b1e52; border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: none; background: none; padding: 10px 6px; border-radius: 10px; font-size: 14px; }
  .seg button.sel { background: linear-gradient(135deg, #ff8ee0, #9b5cff); }
  .card .close-row { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* Schermata di arrivo */
  #arrive { align-items: center; }
  .arrive-card { text-align: center; padding: 30px 24px 22px; width: min(420px, 100%); }
  .burst { position: relative; width: 96px; height: 96px; margin: 0 auto 14px; display: grid; place-items: center; }
  .burst .core { width: 76px; height: 76px; border-radius: 50%; background: linear-gradient(135deg, #ff8ee0, #9b5cff); display: grid; place-items: center; animation: popIn .6s cubic-bezier(.2,1.6,.4,1) both; box-shadow: 0 0 40px rgba(255,142,224,.6); }
  .burst .core svg { width: 40px; height: 40px; }
  .burst .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--pink); animation: ring 1.6s ease-out infinite; }
  .burst .ring:nth-child(2) { animation-delay: .5s; }
  @keyframes popIn { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ring { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  .arrive-card h2 { margin: 6px 0 4px; font-size: 28px; }
  #arrName { color: #d9d7ff; font-size: 17px; margin: 0 0 18px; }
  .stats { display: flex; justify-content: center; gap: 26px; margin-bottom: 22px; }
  .stats b { display: block; font-size: 22px; }
  .stats span { font-size: 13px; color: #c9c8ee; }
  .arrive-card .btns { display: flex; gap: 10px; justify-content: center; }

  #toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); background: #fff; color: #1a1c4e; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: 80%; text-align: center; }

  .maplibregl-ctrl-attrib { background: rgba(12,13,40,.7) !important; color: #aaa; }
  .maplibregl-ctrl-attrib a { color: #ccc; }

  @media (max-width: 600px), (max-height: 500px) {
    :root { --dock: 64px; }
    .app { width: 42px; height: 42px; border-radius: 11px; } .app svg { width: 24px; height: 24px; }
    #dock { gap: 8px; } #status { display: none; }
    #speed { transform: scale(.75); transform-origin: top right; top: 12px; right: 12px; }
    #side { top: 90px; right: 12px; gap: 8px; } .icon-btn { width: 42px; height: 42px; } .icon-btn svg { width: 20px; height: 20px; }
    #guide { width: min(330px, calc(100% - var(--dock) - 130px)); padding: 12px 16px; top: 12px; left: calc(var(--dock) + 12px); }
    #then { margin: 10px -16px -12px; padding: 8px 16px; font-size: 14px; }
    #alerts { left: calc(var(--dock) + 12px); width: min(330px, calc(100% - var(--dock) - 130px)); }
    .alert { font-size: 14px; padding: 8px 12px; } .alert .ic { width: 28px; height: 28px; }
    #dist { font-size: 26px; } #instr { font-size: 17px; margin-top: 6px; } #arrow { font-size: 38px; width: 44px; }
    #eta { bottom: 12px; left: calc(var(--dock) + 12px); padding: 10px 6px; }
    #eta b { font-size: 18px; } #eta div { padding: 0 12px; } #eta span { font-size: 13px; }
    #controls { right: 12px; bottom: 12px; } button { padding: 10px 14px; font-size: 14px; }
    .opts { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="dock">
  <div id="clock">--:--</div>
  <div id="status">
    <div style="display:flex;align-items:center;gap:4px"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:11px"></i></span>5G</div>
    <div class="batt"></div>
  </div>
  <div class="app active" style="background:linear-gradient(145deg,#ff8ee0,#7a4dff)" title="Yeezik Maps">
    <svg viewBox="0 0 24 24"><path d="M12 2 20 21 12 16.5 4 21Z" fill="#fff"/></svg>
  </div>
  <div class="app" style="background:#8e5cff" title="Musica">
    <svg viewBox="0 0 24 24"><path d="M9 17.5V6l11-2.5V15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.8" fill="#fff"/><circle cx="17.5" cy="15" r="2.8" fill="#fff"/></svg>
  </div>
  <div class="app" style="background:#34c759" title="Telefono">
    <svg viewBox="0 0 24 24"><path d="M6.6 3.5 9 3l1.8 4.3-2 1.6a12 12 0 0 0 6.3 6.3l1.6-2L21 15l-.5 2.4a2.5 2.5 0 0 1-2.6 2C10.3 19 5 13.7 4.6 6.1a2.5 2.5 0 0 1 2-2.6Z" fill="#fff"/></svg>
    <span class="badge"></span>
  </div>
  <div class="app" style="background:#2b2d55" title="Messaggi">
    <svg viewBox="0 0 24 24"><path d="M12 4c4.97 0 9 3.13 9 7s-4.03 7-9 7c-.9 0-1.77-.1-2.6-.3L5 20l1.2-3.6C4.2 15.1 3 13.2 3 11c0-3.87 4.03-7 9-7Z" fill="#fff"/></svg>
  </div>
  <div id="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<div id="overGlow"></div>

<div id="speed">
  <div id="limit">50</div>
  <div id="cur"><b id="curVal">0</b><span>km/h</span></div>
</div>

<div id="side">
  <button class="icon-btn" id="btnSearch" title="Cerca"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <button class="icon-btn" id="btnOverview" title="Panoramica percorso"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
  <button class="icon-btn" id="btnMode" title="Giorno / notte / tramonto"></button>
  <button class="icon-btn" id="btnShare" title="Condividi arrivo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
  <button class="icon-btn" id="btnSettings" title="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg></button>
</div>

<div id="guide" class="panel empty">
  <div class="row"><div id="arrow">↑</div><div id="dist">—</div></div>
  <div id="instr">Dove andiamo?</div>
  <div id="then" class="hidden"><span>Poi</span><b id="thenArrow">→</b><span id="thenText"></span></div>
  <button id="searchHere" class="primary">Cerca una destinazione</button>
</div>
<div id="alerts"></div>
<div id="eta" class="panel hidden">
  <div><b id="etaTime">--:--</b><span>arrivo</span></div>
  <div><b id="etaMin">--</b><span>min</span></div>
  <div><b id="etaKm">--</b><span>km</span></div>
</div>
<div id="controls"></div>

<!-- Ricerca -->
<div id="search" class="sheet hidden">
  <div class="card">
    <div class="search-top"><input id="q" placeholder="Cerca un indirizzo o un locale" autocomplete="off" enterkeyhint="search"><button id="qClose">Chiudi</button></div>
    <div id="favs"></div>
    <div id="results"></div>
  </div>
</div>

<!-- Impostazioni -->
<div id="settings" class="sheet hidden">
  <div class="card">
    <h3>Indicatore di posizione</h3>
    <div class="opts" id="puckOpts"></div>
    <h3 style="margin-top:20px">Aspetto della mappa</h3>
    <div class="seg" id="modeSeg"></div>
    <h3 style="margin-top:20px">Vista</h3>
    <div class="seg" id="viewSeg"><button data-v="3d">3D</button><button data-v="2d">2D</button></div>
    <div class="close-row"><button id="setClose" class="primary">Fatto</button></div>
  </div>
</div>

<!-- Arrivo -->
<div id="arrive" class="sheet hidden">
  <div class="card arrive-card">
    <div class="burst"><div class="ring"></div><div class="ring"></div><div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div></div>
    <h2>Sei arrivato</h2>
    <p id="arrName"></p>
    <div class="stats">
      <div><b id="arrTime">--:--</b><span>arrivo</span></div>
      <div><b id="arrMin">--</b><span>min</span></div>
      <div><b id="arrKm">--</b><span>km</span></div>
    </div>
    <div class="btns"><button id="arrShare">Condividi</button><button id="arrClose" class="primary">Chiudi</button></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
const STYLE = {
 "version": 8,
 "name": "Yeezik Night",
 "metadata": {
  "author": "Yeezik",
  "description": "Stile notte blu-viola con percorso rosa, per iPhone e CarPlay"
 },
 "sources": {
  "openmaptiles": {
   "type": "vector",
   "url": "https://tiles.openfreemap.org/planet"
  }
 },
 "glyphs": "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
 "layers": [
  {
   "id": "background",
   "type": "background",
   "paint": {
    "background-color": "#1f2278"
   }
  },
  {
   "id": "landuse-residential",
   "type": "fill",
   "source": "openmaptiles",
   "source-layer": "landuse",
   "filter": [
    "in",
    [
     "get",
     "class"
    ],
    [
     "literal",
     [
      "residential",
      "suburb",
      "neighbourhood"
     ]
    ]
   ],
   "paint": {
    "fill-color": "#22267f"
   }
  },
  {
   "id": "landuse-commercial",
   "type": "fill",
   "source": "openmaptiles",
   "source-layer": "landuse",
   "filter": [
    "in",
    [
     "get",
     "class"
    ],
    [
     "literal",
     [
      "commercial",
      "retail",
      "industrial"
     ]
    ]
   ],
   "paint": {
    "fill-color": "#262a88"
   }
  },
  {
   "id": "park",
   "type": "fill",
   "source": "openmaptiles",
   "source-layer": "park",
   "paint": {
    "fill-color": "#1f4a45",
    "fill-opacity": 0.9
   }
  },
  {
   "id": "landcover-green",
   "type": "fill",
   "source": "openmaptiles",
   "source-layer": "landcover",
   "filter": [
    "in",
    [
     "get",
     "class"
    ],
    [
     "literal",
     [
      "grass",
      "wood",
      "farmland"
     ]
    ]
   ],
   "paint": {
    "fill-color": "#1f4a45",
    "fill-opacity": 0.75
   }
  },
  {
   "id": "water",
   "type": "fill",
   "source": "openmaptiles",
   "source-layer": "water",
   "paint": {
    "fill-color": "#12165a"
   }
  },
  {
   "id": "waterway",
   "type": "line",
   "source": "openmaptiles",
   "source-layer": "waterway",
   "paint": {
    "line-color": "#12165a",
    "line-width": [
     "interpolate",

// ================= Geometria =================
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
  const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function destPoint(p, brg, d) {
  const φ1 = rad(p[1]), λ1 = rad(p[0]), θ = rad(brg), δ = d / R;
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return [deg(λ2), deg(φ2)];
}
function inRing(p, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}

// ================= Alba e tramonto (per la modalità automatica) =================
function sunTimes(date, lat, lng) {
  const dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad(23.4397), J0 = 0.0009;
  const toDays = d => d.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const fromJ = j => new Date((j + 0.5 - J1970) * dayMs);
  const lw = rad(-lng), phi = rad(lat), d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad(357.5291 + 0.98560028 * ds);
  const C = rad(1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad(102.9372) + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(rad(-0.833)) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const a = J0 + (w + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}

  const c = map.getCenter(), now = new Date(), s = sunTimes(now, c.lat, c.lng);
  if (isNaN(s.rise) || isNaN(s.set)) return 'notte';
  const t = now.getTime(), H = 36e5;
  if ((t > s.rise - 0.5 * H && t < s.rise + 0.75 * H) || (t > s.set - 0.75 * H && t < s.set + 0.75 * H)) return 'tramonto';
  if (t >= s.rise + 0.75 * H && t <= s.set - 0.75 * H) return 'giorno';
  return 'notte';
}

const puck = new maplibregl.Marker({ element: puckEl, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat(here).addTo(map);
const destEl = document.createElement('div');
destEl.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#ff8ee0;border:4px solid #fff;box-shadow:0 0 14px #ff8ee0';
const destMarker = new maplibregl.Marker({ element: destEl });

// ================= Istruzioni =================
const ARROWS = { 'left': '←', 'right': '→', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↙', 'sharp right': '↘', 'straight': '↑', 'uturn': '↶' };
const TURN_IT = { 'left': 'Svolta a sinistra', 'right': 'Svolta a destra', 'slight left': 'Tieni la sinistra', 'slight right': 'Tieni la destra', 'sharp left': 'Svolta decisamente a sinistra', 'sharp right': 'Svolta decisamente a destra', 'straight': 'Prosegui dritto', 'uturn': 'Fai inversione' };
function describe(step) {
  const m = step.maneuver, road = step.name ? `, ${step.name}` : '';
  if (m.type === 'arrive') return { arrow: '⚑', text: 'Arrivo a destinazione', short: 'arrivo' };
  if (m.type === 'roundabout' || m.type === 'rotary' || m.type === 'roundabout turn' || m.type === 'exit roundabout')
    return { arrow: '⟳', text: `Alla rotonda prendi la ${m.exit || 1}ª uscita${road}`, short: `${m.exit || 1}ª uscita${road}` };
  if (m.type === 'depart') return { arrow: '↑', text: `Parti${road ? ' su' + road.slice(1) : ''}`, short: 'parti' };
  const mod = m.modifier || 'straight';
  const t = TURN_IT[mod] || 'Prosegui';
  return { arrow: ARROWS[mod] || '↑', text: t + road, short: (step.name || t.toLowerCase()) };
}
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : (Math.round(m / 10) * 10) + ' m'; }
const fmtTime = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

// ================= Percorso =================
let route = null, rerouting = false;

async function fetchRoute(from, to) {
  const base = `https://router.project-osrm.org/route/v1/driving/${from[0].toFixed(6)},${from[1].toFixed(6)};${to[0].toFixed(6)},${to[1].toFixed(6)}?overview=full&geometries=geojson&steps=true`;
  let r = null;
  try { r = await (await fetch(base + '&annotations=maxspeed')).json(); } catch (e) {}
  if (!r || r.code !== 'Ok') r = await (await fetch(base)).json();
  if (!r || r.code !== 'Ok' || !r.routes.length) throw new Error('nessun percorso');
  const rt = r.routes[0], leg = rt.legs[0];
  const ms = (leg.annotation && leg.annotation.maxspeed) || [];
  return {
    coords: rt.geometry.coordinates, steps: leg.steps, duration: rt.duration,
    maxspeed: ms.map(m => (m && m.speed) ? (m.unit === 'mph' ? Math.round(m.speed * 1.609) : m.speed) : null)
  };
}

function setRoute(data) {
  const coords = data.coords, cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + dist(coords[i - 1], coords[i]));
  let acc = 0; const steps = data.steps.map(s => { const o = { startDist: acc, step: s }; acc += s.distance; return o; });
  route = { coords, cum, total: cum[cum.length - 1] || 1, duration: data.duration, steps, maxspeed: data.maxspeed || [], cams: [], ztl: [], ztlEntries: [] };
  nav.d = 0; nav.idx = 0;
  map.getSource('route-done').setData(emptyFC);
  map.getSource('cams').setData(emptyFC); map.getSource('ztl').setData(emptyFC);
  if (coords.length > 1) puck.setRotation(bearing(coords[0], coords[1]));
  $('guide').classList.remove('empty'); $('eta').classList.remove('hidden');
  drawRouteAnimated();
  updatePanels(0);
  renderControls();
  loadExtras(route);
}

async function planTo(to, name) {
  dest = to; destName = name || destName || 'Destinazione';
  destMarker.setLngLat(dest).addTo(map);
  $('guide').classList.remove('empty');
  $('instr').textContent = 'Calcolo del percorso…';
  try {
    setRoute(await fetchRoute(here, dest));
    if (!nav.mode) overviewRoute(false);
  } catch (e) {
    route = null; destMarker.remove(); renderControls();
    $('guide').classList.add('empty'); $('eta').classList.add('hidden');
    $('instr').textContent = 'Percorso non trovato, riprova'; toast('Non riesco a calcolare il percorso');
  }
}

async function reroute(p) {
  if (rerouting || !dest) return;
  rerouting = true; renderAlerts();
  try {
    setRoute(await fetchRoute(p, dest));
    sim.detour = null; sim.travelled = 0;
  } catch (e) { toast('Ricalcolo non riuscito'); }
  rerouting = false; offSince = 0; renderAlerts();
}

// Il percorso "si disegna" dall'inizio alla fine
let drawRaf;
function drawRouteAnimated() {
  cancelAnimationFrame(drawRaf);
  const rt = route, t0 = performance.now(), dur = Math.min(1600, 700 + rt.total / 10);
  const f = t => {
    if (rt !== route) return;
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), D = rt.total * e;
    const pts = [];
    for (let i = 0; i < rt.coords.length && rt.cum[i] <= D; i++) pts.push(rt.coords[i]);
    pts.push(pointAt(D));
    map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: pts.length > 1 ? pts : [pts[0], pts[0]] } });
    if (k < 1) drawRaf = requestAnimationFrame(f);
  };
  drawRaf = requestAnimationFrame(f);
}

function pointAt(d) {
  const { coords, cum } = route;
  if (coords.length < 2) return coords[0];
  let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
  const a = coords[i - 1], b = coords[i], seg = cum[i] - cum[i - 1] || 1, t = Math.min(1, Math.max(0, (d - cum[i - 1]) / seg));
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

// Proietta un punto sul percorso: quanto hai percorso e quanto sei lontano dalla linea
function project(p, from = 0, to = Infinity) {
  const { coords, cum } = route, kx = 111320 * Math.cos(rad(p[1])), ky = 110540;
  let best = { off: Infinity, d: 0, idx: 0 };
  const a0 = Math.max(0, from), a1 = Math.min(coords.length - 1, to);
  for (let i = a0; i < a1; i++) {
    const ax = (coords[i][0] - p[0]) * kx, ay = (coords[i][1] - p[1]) * ky;
    const bx = (coords[i + 1][0] - p[0]) * kx, by = (coords[i + 1][1] - p[1]) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
    const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2));
    const ox = ax + dx * t, oy = ay + dy * t, off = Math.hypot(ox, oy);
    if (off < best.off) best = { off, d: cum[i] + t * (cum[i + 1] - cum[i]), idx: i };
  }
  return best;
}

// ================= Autovelox e ZTL (da OpenStreetMap, via Overpass) =================
function stitch(ways) {
  const same = (a, b) => Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
  const rings = [], pool = ways.filter(w => w.length > 1).map(w => w.slice());
  while (pool.length) {
    let ring = pool.shift(), changed = true;
    while (changed && !same(ring[0], ring[ring.length - 1])) {
      changed = false;
      for (let i = 0; i < pool.length; i++) {
        const w = pool[i], end = ring[ring.length - 1];
        if (same(end, w[0])) ring = ring.concat(w.slice(1));
        else if (same(end, w[w.length - 1])) ring = ring.concat(w.slice(0, -1).reverse());
        else continue;
        pool.splice(i, 1); changed = true; break;
      }
    }
    if (ring.length > 3 && same(ring[0], ring[ring.length - 1])) rings.push(ring);
  }
  return rings;
}
async function loadExtras(rt) {
  let s = 90, w = 180, n = -90, e = -180;
  rt.coords.forEach(([x, y]) => { s = Math.min(s, y); n = Math.max(n, y); w = Math.min(w, x); e = Math.max(e, x); });
  s -= 0.004; n += 0.004; w -= 0.004; e += 0.004;
  if ((n - s) * (e - w) > 3) return; // percorso troppo lungo per una sola richiesta
  const bb = `${s},${w},${n},${e}`, nm = '"name"~"ZTL|[Zz]ona a [Tt]raffico [Ll]imitato|^Area C$"';
  const q = `[out:json][timeout:25];(node["highway"="speed_camera"](${bb});way["boundary"="low_emission_zone"](${bb});relation["boundary"="low_emission_zone"](${bb});way[${nm}][!"highway"](${bb});relation[${nm}](${bb}););out geom;`;
  let data;
  try {
    data = await (await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })).json();
  } catch (err) { return; }
  if (rt !== route) return;
  const cams = [], polys = [];
  for (const el of data.elements || []) {
    if (el.type === 'node') {
      const p = [el.lon, el.lat], pr = project(p);
      if (pr.off < 30) cams.push({ p, d: pr.d, max: parseInt((el.tags || {}).maxspeed) || null });
    } else if (el.type === 'way' && el.geometry) {
      const ring = el.geometry.map(g => [g.lon, g.lat]);
      if (ring.length > 3 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1]) polys.push({ rings: [ring], name: (el.tags || {}).name || 'ZTL' });
    } else if (el.type === 'relation' && el.members) {
      const outers = el.members.filter(m => m.type === 'way' && m.role !== 'inner' && m.geometry).map(m => m.geometry.map(g => [g.lon, g.lat]));
      const rings = stitch(outers);
      if (rings.length) polys.push({ rings, name: (el.tags || {}).name || 'ZTL' });
    }
  }
  cams.sort((a, b) => a.d - b.d);
  rt.cams = cams; rt.ztl = polys;
  // Punti in cui il percorso entra in una ZTL
  const inside = p => polys.some(z => z.rings.some(r => inRing(p, r)));
  let was = inside(rt.coords[0]);
  if (was) rt.ztlEntries.push(0);
  for (let i = 1; i < rt.coords.length; i++) { const now = inside(rt.coords[i]); if (now && !was) rt.ztlEntries.push(rt.cum[i]); was = now; }
  map.getSource('cams').setData({ type: 'FeatureCollection', features: cams.map(c => ({ type: 'Feature', geometry: { type: 'Point', coordinates: c.p }, properties: {} })) });
  map.getSource('ztl').setData({ type: 'FeatureCollection', features: polys.map(z => ({ type: 'Feature', geometry: { type: 'Polygon', coordinates: z.rings }, properties: { name: z.name } })) });
  if (!nav.mode && (cams.length || rt.ztlEntries.length)) {
    const bits = [];
    if (cams.length) bits.push(`${cams.length} autovelox`);
    if (rt.ztlEntries.length) bits.push('passa in una ZTL');
    toast('Sul percorso: ' + bits.join(' · '));
  }
  renderAlerts();
}

// ================= Navigazione (simulata o GPS) =================
const emptyFC = { type: 'FeatureCollection', features: [] };
const nav = { mode: null, d: 0, idx: 0, kmh: 0, startTime: 0, overview: false };
let limit = 50, limitEstimated = true, offSince = 0, lastLimitCheck = 0;

const LIMITS = { motorway: 130, trunk: 90, primary: 50, secondary: 50, tertiary: 50, minor: 30, service: 30, track: 30 };
const ROAD_LAYERS = ['road-motorway', 'road-primary', 'road-secondary', 'road-minor'];
function estimateLimit(p) {
  const pt = map.project(p);
  const feats = map.queryRenderedFeatures([[pt.x - 6, pt.y - 6], [pt.x + 6, pt.y + 6]], { layers: ROAD_LAYERS });
  const rank = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service', 'track'];
  const best = feats.map(f => f.properties.class).sort((a, b) => rank.indexOf(a) - rank.indexOf(b))[0];
  return best && LIMITS[best] ? LIMITS[best] : null;
}
function updateLimit(p) {
  const real = route && route.maxspeed[nav.idx];
  if (real) { limit = real; limitEstimated = false; }
  else if (performance.now() - lastLimitCheck > 500) {
    lastLimitCheck = performance.now();
    const est = estimateLimit(p); if (est) limit = est; limitEstimated = true;
  }
}
function updateSpeed() {
  $('limit').textContent = limit;
  $('limit').classList.toggle('est', limitEstimated);
  $('limit').title = limitEstimated ? 'Limite stimato dal tipo di strada' : 'Limite da OpenStreetMap';
  $('curVal').textContent = Math.round(nav.kmh);
  const over = nav.mode && nav.kmh > limit + 2;
  $('cur').classList.toggle('over', !!over);
  $('overGlow').classList.toggle('on', !!over);
}

function updatePanels(d) {
  if (!route) return;
  const i = route.steps.findIndex(s => s.startDist > d + 1);
  const next = i >= 0 ? route.steps[i] : route.steps[route.steps.length - 1];
  const info = describe(next.step);
  $('arrow').textContent = info.arrow;
  $('dist').textContent = fmtDist(Math.max(0, next.startDist - d));
  $('instr').textContent = info.text;
  // Manovra successiva: solo se arriva subito dopo
  const after = i >= 0 ? route.steps[i + 1] : null;
  if (after && after.startDist - next.startDist < 400 && after.step.maneuver.type !== 'arrive') {
    const a = describe(after.step);
    $('thenArrow').textContent = a.arrow; $('thenText').textContent = a.short;
    $('then').classList.remove('hidden');
  } else $('then').classList.add('hidden');
  const remaining = Math.max(0, route.total - d);
  const secs = route.duration * (remaining / route.total);
  $('etaTime').textContent = fmtTime(new Date(Date.now() + secs * 1000));
  $('etaMin').textContent = Math.max(0, Math.round(secs / 60));
  $('etaKm').textContent = (remaining / 1000).toFixed(remaining < 10000 ? 1 : 0).replace('.', ',');
}

function renderAlerts() {
  const box = $('alerts'), want = [];
  if (rerouting) want.push({ id: 'rr', cls: 'info', ic: '↻', html: 'Ricalcolo del percorso…' });
  if (route) {
    const d = nav.d;
    const cam = route.cams.find(c => c.d > d - 15 && c.d - d < 700);
    if (cam) want.push({ id: 'cam', cls: 'cam', ic: '📷', html: `Autovelox tra ${fmtDist(Math.max(0, cam.d - d))}<small>Limite ${cam.max || limit} km/h</small>` });
    const z = route.ztlEntries.find(e => e > d - 5 && e - d < 800);
    if (z !== undefined) want.push({ id: 'ztl', cls: 'ztl', ic: 'ZTL', html: `${z - d < 20 ? 'Stai entrando in una ZTL' : 'ZTL tra ' + fmtDist(z - d)}<small>Controlla di avere il permesso</small>` });
  }
  // Aggiorna solo il testo degli avvisi già visibili, così l'animazione non riparte
  const ids = want.map(a => a.id);
  [...box.children].forEach(el => { if (!ids.includes(el.dataset.id)) el.remove(); });
  want.forEach((a, i) => {
    let el = box.querySelector(`[data-id="${a.id}"]`);
    if (!el) { el = document.createElement('div'); el.dataset.id = a.id; el.className = 'alert ' + a.cls; el.innerHTML = `<div class="ic">${a.ic}</div><div class="tx"></div>`; }
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
    const tx = el.querySelector('.tx'); if (tx.innerHTML !== a.html) tx.innerHTML = a.html;
  });
  const g = $('guide');
  box.style.top = (g.offsetTop + g.offsetHeight + 10) + 'px';
}

function onPosition(p, b, kmh) {
  here = p; nav.kmh = kmh;
  puck.setLngLat(p).setRotation(b);
  if (!route) return;
  const pr = project(p, nav.idx - 3, nav.idx + 400);
  const pf = pr.off > 35 ? project(p) : pr; // se sembra fuori, cerca su tutto il percorso
  if (pf.off > 35) {
    if (!offSince) offSince = performance.now();
    if (performance.now() - offSince > 1500) reroute(p);
  } else {
    offSince = 0;
    nav.d = pf.d; nav.idx = pf.idx;
  }
  updateLimit(p); updateSpeed(); updatePanels(nav.d); renderAlerts();
  const passed = route.coords.slice(0, nav.idx + 1).concat([pointAt(nav.d)]);
  map.getSource('route-done').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: passed.length > 1 ? passed : [p, p] } });
  if (!nav.overview) {
    const cam = { center: p, bearing: b, zoom: 17, pitch: NAV_PITCH, padding: { top: map.getContainer().clientHeight * 0.4, bottom: 0, left: 0, right: 0 } };
    if (nav.mode === 'gps') map.easeTo({ ...cam, duration: 900 }); else map.jumpTo(cam);
  }
  if (route.total - nav.d < 15 && !rerouting && pf.off < 35) arrive();
}

// --- Simulazione ---
const sim = { on: false, travelled: 0, last: 0, detour: null };
const PLAYBACK = 4;
function simFrame(t) {
  if (!sim.on || nav.mode !== 'sim') return;
  const dt = sim.last ? Math.min(0.1, (t - sim.last) / 1000) : 0; sim.last = t;
  const target = limit * (0.85 + 0.25 * (0.5 + 0.5 * Math.sin(t / 2500)));
  const kmh = nav.kmh + (target - nav.kmh) * Math.min(1, dt * 0.8);
  const step = (kmh / 3.6) * PLAYBACK * dt;
  let p, b;
  if (sim.detour) {
    const dd = sim.detour; dd.done = Math.min(dd.len, dd.done + step);
    const f = dd.done / dd.len; p = [dd.from[0] + (dd.to[0] - dd.from[0]) * f, dd.from[1] + (dd.to[1] - dd.from[1]) * f]; b = dd.b;
  } else {
    if (!rerouting) sim.travelled = Math.min(route.total, sim.travelled + step);
    p = pointAt(sim.travelled);
    b = sim.travelled < route.total ? bearing(p, pointAt(Math.min(route.total, sim.travelled + 40))) : map.getBearing();
  }
  onPosition(p, b, kmh);
  requestAnimationFrame(simFrame);
}
function wrongTurn() {
  if (!route || sim.detour) return;
  const p = pointAt(sim.travelled), b = bearing(p, pointAt(Math.min(route.total, sim.travelled + 40)));
  const nb = (b + (Math.random() < 0.5 ? 70 : -70) + 360) % 360;
  sim.detour = { from: p, to: destPoint(p, nb, 220), len: 220, done: 0, b: nb };
  toast('Hai sbagliato strada (simulato)');
}

// --- GPS reale ---
let watchId = null, lastFix = null, lastB = 0;
function startGps() {
  if (!navigator.geolocation) { toast('Posizione non disponibile su questo dispositivo'); return; }
  nav.mode = 'gps'; nav.startTime = Date.now(); nav.overview = false; renderControls(); drawRouteAnimated();
  watchId = navigator.geolocation.watchPosition(pos => {
    const p = [pos.coords.longitude, pos.coords.latitude];
    let kmh = pos.coords.speed != null && pos.coords.speed >= 0 ? pos.coords.speed * 3.6 : 0;
    let b = pos.coords.heading;
    if (lastFix) {
      const dd = dist(lastFix.p, p), dt = (pos.timestamp - lastFix.t) / 1000;
      if (pos.coords.speed == null && dt > 0) kmh = dd / dt * 3.6;
      if ((b == null || isNaN(b)) && dd > 3) b = bearing(lastFix.p, p);
    }
    if (b == null || isNaN(b)) b = lastB; lastB = b;
    lastFix = { p, t: pos.timestamp };
    onPosition(p, b, kmh);
  }, err => { toast('Non riesco a leggere il GPS: ' + err.message); stopNav(); }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
}

function startSim() {
  if (!route) return;
  nav.mode = 'sim'; nav.startTime = Date.now(); nav.overview = false;
  sim.on = true; sim.last = 0; sim.detour = null;
  if (sim.travelled >= route.total) sim.travelled = 0;
  if (sim.travelled === 0) drawRouteAnimated();
  renderControls();
  requestAnimationFrame(simFrame);
}
function pauseSim() { sim.on = false; nav.kmh = 0; updateSpeed(); renderControls(); }
function stopNav() {
  sim.on = false; sim.detour = null; sim.travelled = 0;
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; lastFix = null; }
  nav.mode = null; nav.kmh = 0; nav.overview = false;
  updateSpeed(); renderControls();
  if (route) { map.getSource('route-done').setData(emptyFC); updatePanels(0); }
}
function arrive() {
  const mins = nav.mode === 'sim' ? Math.round(route.duration / 60) : Math.round((Date.now() - nav.startTime) / 60000);
  $('arrName').textContent = destName || 'Destinazione';
  $('arrTime').textContent = fmtTime(new Date());
  $('arrMin').textContent = mins;
  $('arrKm').textContent = (route.total / 1000).toFixed(1).replace('.', ',');
  sim.on = false;
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  nav.mode = null; nav.kmh = 0; updateSpeed(); renderControls();
  $('arrive').classList.remove('hidden');
}

function renderControls() {
  const c = $('controls'); c.innerHTML = '';
  const add = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if (cls) b.className = cls; c.appendChild(b); };
  if (!route) return;
  if (nav.mode === 'sim') {
    add(sim.on ? '❚❚ Pausa' : '▶ Riprendi', () => sim.on ? pauseSim() : startSim());
    if (sim.on) add('↪ Sbaglia strada', wrongTurn);
    add('■ Stop', stopNav);
  } else if (nav.mode === 'gps') {
    add('■ Termina', stopNav);
  } else {
    add('📍 Guida reale', startGps, 'primary');
    add('▶ Simula guida', startSim);
  }
}

// ================= Panoramica =================
function overviewRoute(toggle = true) {
  if (!route) return;
  if (toggle && nav.overview) { nav.overview = false; $('btnOverview').classList.remove('on'); if (nav.mode) onPosition(here, map.getBearing(), nav.kmh); return; }
  nav.overview = !!nav.mode; $('btnOverview').classList.toggle('on', nav.overview);
  const b = new maplibregl.LngLatBounds();
  route.coords.forEach(c => b.extend(c)); b.extend(here);
  const W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  map.fitBounds(b, { padding: { top: Math.min(H * 0.3, 190), bottom: Math.min(H * 0.22, 110), left: Math.min(W * 0.3, 470), right: Math.min(W * 0.2, 170) }, pitch: 0, bearing: 0, duration: 900, maxZoom: 16 });
}

// ================= Ricerca e preferiti =================
let favs = store.get('yz-favs', []), pendingFav = null, searchT, lastResults = [];
const FAV_ICON = { casa: '🏠', lavoro: '💼', fav: '★' };
function openSearch(forType) {
  pendingFav = forType || null;
  $('search').classList.remove('hidden');
  $('q').value = ''; $('q').placeholder = forType ? `Cerca l'indirizzo di ${forType === 'casa' ? 'Casa' : 'Lavoro'}` : 'Cerca un indirizzo o un locale';
  renderFavs(); $('results').innerHTML = '';
  setTimeout(() => $('q').focus(), 50);
}
function closeSearch() { $('search').classList.add('hidden'); $('q').blur(); }
function renderFavs() {
  const box = $('favs'); box.innerHTML = '';
  ['casa', 'lavoro'].forEach(t => {
    const f = favs.find(x => x.type === t);
    const el = document.createElement('div');
    el.className = 'chip' + (f ? '' : ' unset');
    el.innerHTML = f ? `${FAV_ICON[t]} ${t === 'casa' ? 'Casa' : 'Lavoro'} <span class="x" title="Rimuovi">✕</span>` : `${FAV_ICON[t]} Imposta ${t === 'casa' ? 'Casa' : 'Lavoro'}`;
    el.onclick = ev => {
      if (ev.target.classList.contains('x')) { favs = favs.filter(x => x !== f); store.set('yz-favs', favs); renderFavs(); return; }
      if (f) { closeSearch(); planTo([f.lng, f.lat], f.name); } else openSearch(t);
    };
    box.appendChild(el);
  });
  favs.filter(f => f.type === 'fav').forEach(f => {
    const el = document.createElement('div'); el.className = 'chip';
    el.innerHTML = `★ ${f.name} <span class="x" title="Rimuovi">✕</span>`;
    el.onclick = ev => {
      if (ev.target.classList.contains('x')) { favs = favs.filter(x => x !== f); store.set('yz-favs', favs); renderFavs(); return; }
      closeSearch(); planTo([f.lng, f.lat], f.name);
    };
    box.appendChild(el);
  });
}
function saveFav(type, r) {
  favs = favs.filter(f => !(type !== 'fav' && f.type === type));
  favs.push({ type, name: r.name, lng: r.p[0], lat: r.p[1] });
  store.set('yz-favs', favs); renderFavs();
  toast(type === 'fav' ? `${r.name} salvato nei preferiti` : `${type === 'casa' ? 'Casa' : 'Lavoro'} salvato`);
}
function placeLabel(pr) {
  const line1 = pr.name || [pr.street, pr.housenumber].filter(Boolean).join(' ') || pr.city || 'Luogo';
  const line2 = [pr.name && pr.street ? [pr.street, pr.housenumber].filter(Boolean).join(' ') : '', pr.city || pr.county, pr.country !== 'Italia' && pr.country !== 'Italy' ? pr.country : ''].filter(Boolean).join(', ');
  return { name: line1, sub: line2 };
}
async function runSearch(text) {
  if (text.trim().length < 3) { $('results').innerHTML = ''; return; }
  $('results').innerHTML = '<div class="muted">Cerco…</div>';
  try {
    const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(text)}&lang=it&limit=7&lat=${here[1]}&lon=${here[0]}`;
    const r = await (await fetch(u)).json();
    if ($('q').value !== text) return;
    lastResults = (r.features || []).map(f => ({ p: f.geometry.coordinates, ...placeLabel(f.properties) }));
    renderResults();
  } catch (e) { $('results').innerHTML = '<div class="muted">Ricerca non disponibile, riprova.</div>'; }
}
function renderResults() {
  const box = $('results'); box.innerHTML = '';
  if (!lastResults.length) { box.innerHTML = '<div class="muted">Nessun risultato</div>'; return; }
  lastResults.forEach(r => {
    const el = document.createElement('div'); el.className = 'res';
    const km = dist(here, r.p) / 1000;
    el.innerHTML = `<div class="pin">📍</div><div class="txt"><div></div><small></small></div>`;
    el.querySelector('.txt div').textContent = r.name;
    el.querySelector('.txt small').textContent = [r.sub, km < 100 ? km.toFixed(1).replace('.', ',') + ' km' : ''].filter(Boolean).join(' · ');
    if (pendingFav) {
      el.onclick = () => { saveFav(pendingFav, r); pendingFav = null; $('q').placeholder = 'Cerca un indirizzo o un locale'; $('q').value = ''; box.innerHTML = ''; };
    } else {
      const s = document.createElement('button'); s.className = 'save'; s.textContent = '☆ Salva';
      s.onclick = ev => {
        ev.stopPropagation();
        const m = document.createElement('div'); m.className = 'savemenu';
        [['casa', '🏠 Casa'], ['lavoro', '💼 Lavoro'], ['fav', '★ Preferito']].forEach(([t, l]) => {
          const b = document.createElement('button'); b.textContent = l;
          b.onclick = e2 => { e2.stopPropagation(); saveFav(t, r); m.replaceWith(s); };
          m.appendChild(b);
        });
        s.replaceWith(m);
      };
      el.appendChild(s);
      el.onclick = () => { closeSearch(); if (nav.mode) stopNav(); planTo(r.p, r.name); };
    }
    box.appendChild(el);
  });
}
$('q').addEventListener('input', e => { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => runSearch(v), 300); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchT); runSearch(e.target.value); } });
$('qClose').onclick = closeSearch;
$('btnSearch').onclick = () => openSearch();
$('searchHere').onclick = () => openSearch();

async function reverseName(p) {
  try {
    const r = await (await fetch(`https://photon.komoot.io/reverse?lon=${p[0]}&lat=${p[1]}&lang=it`)).json();
    const f = (r.features || [])[0]; if (f) return placeLabel(f.properties).name;
  } catch (e) {}
  return 'Punto sulla mappa';
}

// ================= Condividi =================
async function shareTrip(arrived) {
  const name = destName || 'destinazione';
  const pos = `https://maps.apple.com/?ll=${here[1].toFixed(5)},${here[0].toFixed(5)}&q=${encodeURIComponent('La mia posizione')}`;
  let text;
  if (arrived) text = `Sono arrivato a ${name} ✅`;
  else if (route) text = `Sto arrivando a ${name} 🚗 Arrivo previsto alle ${$('etaTime').textContent} (tra ${$('etaMin').textContent} min).\nLa mia posizione: ${pos}`;
  else text = `La mia posizione: ${pos}`;
  if (navigator.share) { try { await navigator.share({ title: 'Yeezik Maps', text }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(text); toast('Messaggio copiato: incollalo dove vuoi'); } catch (e) { toast(text); }
}
$('btnShare').onclick = () => shareTrip(false);
$('arrShare').onclick = () => shareTrip(true);
$('arrClose').onclick = () => {
  $('arrive').classList.add('hidden');
  route = null; dest = null; destMarker.remove();
  ['route', 'route-done', 'cams', 'ztl'].forEach(s => map.getSource(s).setData(emptyFC));
  $('guide').classList.add('empty'); $('instr').textContent = 'Dove andiamo?'; $('eta').classList.add('hidden');
  renderAlerts(); renderControls();
  map.easeTo({ pitch: 66, padding: { top: 0, bottom: 0, left: 0, right: 0 }, duration: 700 });
};

// ================= Impostazioni =================
function renderSettings() {
  const po = $('puckOpts'); po.innerHTML = '';
  Object.entries(PUCKS).forEach(([k, v]) => {
    const el = document.createElement('div'); el.className = 'opt' + (k === puckPref ? ' sel' : '');
    el.innerHTML = `<div class="prev">${v.svg.replace(/id="(\w+)"/g, 'id="$1_' + k + '"').replace(/url\(#(\w+)\)/g, 'url(#$1_' + k + ')')}</div>${v.name}`;
    el.onclick = () => { setPuck(k); renderSettings(); };
    po.appendChild(el);
  });
  const ms = $('modeSeg'); ms.innerHTML = '';
  ['auto', 'notte', 'tramonto', 'giorno'].forEach(m => {
    const b = document.createElement('button'); b.textContent = MODE_NAMES[m]; if (m === modePref) b.className = 'sel';
    b.onclick = () => { setMode(m); renderSettings(); }; ms.appendChild(b);
  });
  document.querySelectorAll('#viewSeg button').forEach(b => {
    b.className = (b.dataset.v === '2d') === (map.getPitch() < 10) ? 'sel' : '';
    b.onclick = () => { map.easeTo({ pitch: b.dataset.v === '2d' ? 0 : (nav.mode ? NAV_PITCH : 66), duration: 600 }); setTimeout(renderSettings, 650); };
  });
}
function setMode(m) { modePref = m; store.set('yz-mode', m); activePalette = null; applyMode(); }
$('btnSettings').onclick = () => { renderSettings(); $('settings').classList.remove('hidden'); };
$('setClose').onclick = () => $('settings').classList.add('hidden');
$('btnMode').onclick = () => {
  const order = ['auto', 'notte', 'tramonto', 'giorno'];
  setMode(order[(order.indexOf(modePref) + 1) % order.length]);
  toast('Aspetto: ' + MODE_NAMES[modePref] + (modePref === 'auto' ? ` (ora ${autoMode()})` : ''));
};
$('btnOverview').onclick = () => overviewRoute(true);
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s && s.id !== 'arrive') s.classList.add('hidden'); }));

// Tocca la mappa per scegliere una destinazione
map.on('click', async e => {
  if (nav.mode) return;
  const p = [e.lngLat.lng, e.lngLat.lat];
  destName = '';
  planTo(p, 'Punto sulla mappa');
  const n = await reverseName(p);
  if (dest === p) { destName = n; }
});

function tick() { $('clock').textContent = fmtTime(new Date()); }
tick(); setInterval(tick, 10000);
setInterval(() => { if (modePref === 'auto') applyMode(); }, 60000);
$('btnMode').innerHTML = MODE_ICONS[modePref];

map.on('load', () => {
  map.addSource('route', { type: 'geojson', data: emptyFC });
  map.addSource('route-done', { type: 'geojson', data: emptyFC });
  map.addSource('cams', { type: 'geojson', data: emptyFC });
  map.addSource('ztl', { type: 'geojson', data: emptyFC });
  map.addLayer({ id: 'ztl-fill', type: 'fill', source: 'ztl', paint: { 'fill-color': '#ff2a4a', 'fill-opacity': 0.1 } }, 'road-minor');
  map.addLayer({ id: 'ztl-line', type: 'line', source: 'ztl', paint: { 'line-color': '#ff4a6a', 'line-width': 2.5, 'line-dasharray': [3, 2], 'line-opacity': 0.85 } }, 'building-3d');
  const before = 'building-3d';
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ff8ee0', 'line-width': ['interpolate', ['exponential', 1.5], ['zoom'], 12, 4.5, 18, 26] } }, before);
  map.addLayer({ id: 'route-core', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffc6f0', 'line-width': ['interpolate', ['exponential', 1.5], ['zoom'], 12, 2.7, 18, 15.6] } }, before);
  map.addLayer({ id: 'route-done-line', type: 'line', source: 'route-done', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#7c79bf', 'line-width': ['interpolate', ['exponential', 1.5], ['zoom'], 12, 5, 18, 27] } }, before);
  map.addLayer({ id: 'cams', type: 'symbol', source: 'cams', layout: { 'icon-image': 'yz-cam', 'icon-size': 0.55, 'icon-anchor': 'bottom', 'icon-allow-overlap': true } });
  applyMode();

  // Parti dalla tua posizione (se la concedi), altrimenti da Milano
  const fallback = () => { planTo([9.1900, 45.4642], 'Duomo di Milano'); };
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      here = [pos.coords.longitude, pos.coords.latitude];
      puck.setLngLat(here);
      map.jumpTo({ center: here, zoom: 16.4 });
      activePalette = null; applyMode();
    }, fallback, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  } else fallback();
});
</script>
</body>
