<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeezik Maps — anteprima stile</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c2e; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; background: rgba(12, 13, 40, 0.94); border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #guide { top: 20px; left: 20px; width: min(420px, calc(100% - 40px)); padding: 20px 24px; }
  #guide .row { display: flex; align-items: center; gap: 18px; }
  #arrow { font-size: 54px; line-height: 1; font-weight: 700; width: 60px; text-align: center; }
  #dist { font-size: 36px; font-weight: 700; }
  #instr { margin-top: 10px; font-size: 24px; font-weight: 700; line-height: 1.25; }
  #eta { bottom: 20px; left: 20px; display: flex; padding: 14px 10px; }
  #eta div { text-align: center; padding: 0 22px; }
  #eta b { display: block; font-size: 24px; }
  #eta span { font-size: 16px; color: #c9c8ee; }
  #controls { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px; }
  button { background: rgba(12,13,40,.94); color: #fff; border: 1px solid #ff8ee0; border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2a1e5a; }
  #hint { position: absolute; top: 20px; right: 20px; max-width: 260px; font-size: 13px; color: #c9c8ee; padding: 12px 16px; border-radius: 14px; }
  .puck { width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-bottom: 26px solid #fff; filter: drop-shadow(0 0 6px rgba(255,142,224,.9)); }
  .maplibregl-ctrl-attrib { background: rgba(12,13,40,.7) !important; color: #aaa; }
  .maplibregl-ctrl-attrib a { color: #ccc; }
  @media (max-width: 600px) {
    #dist { font-size: 28px; } #instr { font-size: 18px; } #arrow { font-size: 42px; }
    #eta b { font-size: 19px; } #eta div { padding: 0 12px; }
    #controls { bottom: 90px; } #hint { display: none; }
  }
</style>
</head>

<div id="map"></div>

  <div id="instr">Calcolo del percorso…</div>
</div>
<div id="eta" class="panel">
  <div><b id="etaTime">--:--</b><span>arrivo</span></div>
  <div><b id="etaMin">--</b><span>min</span></div>
  <div><b id="etaKm">--</b><span>km</span></div>
</div>
<div id="hint" class="panel">Tocca la mappa per scegliere una nuova destinazione, poi premi <b>Simula guida</b>.</div>
<div id="controls">
  <button id="driveBtn">▶ Simula guida</button>
  <button id="viewBtn">Vista 2D</button>

// Partenza e arrivo di default (Milano: Stazione Centrale → Duomo)
let start = [9.2040, 45.4855];
let dest = [9.1900, 45.4642];

const map = new maplibregl.Map({
  container: 'map',
  style: STYLE,
  center: start,
  zoom: 16.4,
  pitch: 62,
  bearing: -20,
  maxPitch: 75,
  attributionControl: { compact: true, customAttribution: '© OpenFreeMap · © OpenMapTiles · © OpenStreetMap' }
});

// --- Icone dei punti d'interesse: quadratini bianchi arrotondati con simbolo scuro ---
function makeIcon(draw) {
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.beginPath(); g.roundRect(4, 4, s - 8, s - 8, 14); g.fill();
  g.strokeStyle = g.fillStyle = '#1c1e5e'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
  draw(g);
  return g.getImageData(0, 0, s, s);
}
const ICONS = {
  'yz-food': g => { g.beginPath(); g.arc(32, 30, 14, 0, Math.PI); g.closePath(); g.fill(); g.fillRect(20, 44, 24, 4); g.beginPath(); g.moveTo(26, 24); g.lineTo(30, 16); g.moveTo(34, 24); g.lineTo(40, 14); g.stroke(); },
  'yz-bed': g => { g.beginPath(); g.moveTo(16, 18); g.lineTo(16, 46); g.moveTo(16, 38); g.lineTo(48, 38); g.lineTo(48, 46); g.stroke(); g.fillRect(28, 28, 20, 10); g.beginPath(); g.arc(22, 31, 4, 0, 7); g.fill(); },
  'yz-shop': g => { g.beginPath(); g.arc(32, 20, 4, Math.PI, 0); g.lineTo(32, 26); g.lineTo(48, 42); g.lineTo(16, 42); g.lineTo(32, 26); g.stroke(); },
  'yz-health': g => { g.beginPath(); g.moveTo(32, 46); g.bezierCurveTo(10, 32, 16, 14, 32, 24); g.bezierCurveTo(48, 14, 54, 32, 32, 46); g.fill(); },
  'yz-car': g => { g.fillRect(18, 30, 28, 10); g.beginPath(); g.moveTo(22, 30); g.lineTo(26, 22); g.lineTo(38, 22); g.lineTo(42, 30); g.fill(); g.beginPath(); g.arc(24, 42, 4, 0, 7); g.arc(40, 42, 4, 0, 7); g.fill(); },
  'yz-pin': g => { g.beginPath(); g.arc(32, 28, 9, 0, 7); g.fill(); g.beginPath(); g.moveTo(26, 34); g.lineTo(32, 46); g.lineTo(38, 34); g.fill(); }
};
map.on('styleimagemissing', e => {

// --- Puntatore posizione ---
const puckEl = document.createElement('div'); puckEl.className = 'puck';
const puck = new maplibregl.Marker({ element: puckEl, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat(start).addTo(map);
const destEl = document.createElement('div');
destEl.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#ff8ee0;border:4px solid #fff;box-shadow:0 0 14px #ff8ee0';

// --- Geometria ---
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
  const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}

// --- Istruzioni in italiano ---
const ARROWS = { 'left': '←', 'right': '→', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↙', 'sharp right': '↘', 'straight': '↑', 'uturn': '↶' };
const TURN_IT = { 'left': 'Svolta a sinistra', 'right': 'Svolta a destra', 'slight left': 'Tieni la sinistra', 'slight right': 'Tieni la destra', 'sharp left': 'Svolta decisamente a sinistra', 'sharp right': 'Svolta decisamente a destra', 'straight': 'Prosegui dritto', 'uturn': 'Fai inversione' };
function describe(step) {
  const m = step.maneuver, road = step.name ? `, ${step.name}` : '';
  if (m.type === 'arrive') return { arrow: '⚑', text: 'Arrivo a destinazione' };
  if (m.type === 'roundabout' || m.type === 'rotary' || m.type === 'roundabout turn')
    return { arrow: '⟳', text: `Alla rotonda prendi la ${m.exit || 1}ª uscita${road}` };
  if (m.type === 'depart') return { arrow: '↑', text: `Parti${road ? ' su' + road.slice(1) : ''}` };
  const mod = m.modifier || 'straight';
  return { arrow: ARROWS[mod] || '↑', text: (TURN_IT[mod] || 'Prosegui') + road };
}
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : (Math.round(m / 10) * 10) + ' m'; }

// --- Percorso ---
let route = null; // { coords, cum, total, duration, steps:[{startDist, step}] }
function setRouteData(coords, steps, duration) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + dist(coords[i - 1], coords[i]));
  let acc = 0; const st = steps.map(s => { const o = { startDist: acc, step: s }; acc += s.distance; return o; });
  route = { coords, cum, total: cum[cum.length - 1], duration, steps: st };
  map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  updatePanels(0);
}
async function loadRoute() {
  document.getElementById('instr').textContent = 'Calcolo del percorso…';
  const url = `https://router.project-osrm.org/route/v1/driving/${start.join(',')};${dest.join(',')}?overview=full&geometries=geojson&steps=true`;
  try {
    const r = await (await fetch(url)).json();
    const rt = r.routes[0];
    setRouteData(rt.geometry.coordinates, rt.legs[0].steps, rt.duration);
  } catch (e) {
    // Senza connessione al servizio percorsi: linea diretta di prova
    const d = dist(start, dest);
    setRouteData([start, dest], [{ distance: d, name: '', maneuver: { type: 'depart' } }, { distance: 0, name: '', maneuver: { type: 'arrive' } }], d / 8);
  }
}

function updatePanels(d) {
  if (!route) return;
  let next = route.steps.find(s => s.startDist > d + 1) || route.steps[route.steps.length - 1];
  const info = describe(next.step);
  document.getElementById('arrow').textContent = info.arrow;
  document.getElementById('dist').textContent = fmtDist(Math.max(0, next.startDist - d));
  document.getElementById('instr').textContent = info.text;
  const remaining = Math.max(0, route.total - d);
  const secs = route.duration * (remaining / route.total || 0);
  const arr = new Date(Date.now() + secs * 1000);
  document.getElementById('etaTime').textContent = arr.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('etaMin').textContent = Math.max(0, Math.round(secs / 60));
  document.getElementById('etaKm').textContent = (remaining / 1000).toFixed(remaining < 10000 ? 1 : 0).replace('.', ',');
}

function pointAt(d) {
  const { coords, cum } = route;
  let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
  const a = coords[i - 1], b = coords[i], seg = cum[i] - cum[i - 1] || 1, t = Math.min(1, Math.max(0, (d - cum[i - 1]) / seg));
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

// --- Simulazione guida ---
let driving = false, travelled = 0, last = 0;
const SPEED = 14 * 4; // m/s (≈50 km/h, accelerato x4)
function frame(t) {
  if (!driving) return;
  const dt = last ? (t - last) / 1000 : 0; last = t;
  travelled = Math.min(route.total, travelled + SPEED * dt);
  const p = pointAt(travelled), ahead = pointAt(Math.min(route.total, travelled + 40));
  const b = travelled < route.total ? bearing(p, ahead) : map.getBearing();
  puck.setLngLat(p).setRotation(0);
  map.jumpTo({ center: p, bearing: b });
  // Traccia già percorsa diventa più tenue
  const passed = route.coords.filter((_, i) => route.cum[i] <= travelled).concat([p]);
  map.getSource('route-done').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: passed.length > 1 ? passed : [p, p] } });
  updatePanels(travelled);
  if (travelled >= route.total) { driving = false; driveBtn.textContent = '↺ Ricomincia'; return; }
  requestAnimationFrame(frame);
}
const driveBtn = document.getElementById('driveBtn');
driveBtn.onclick = () => {
  if (!route) return;
  if (driving) { driving = false; driveBtn.textContent = '▶ Riprendi'; return; }
  if (travelled >= route.total) travelled = 0;
  driving = true; last = 0; driveBtn.textContent = '❚❚ Pausa';
  map.easeTo({ pitch: 62, zoom: 17, duration: 600 });
  requestAnimationFrame(frame);
};
let is3D = true;
document.getElementById('viewBtn').onclick = e => {
  is3D = !is3D; map.easeTo({ pitch: is3D ? 62 : 0, duration: 700 });
  e.target.textContent = is3D ? 'Vista 2D' : 'Vista 3D';
};

map.on('click', e => {
  if (driving) return;
  if (route && travelled > 0) start = pointAt(travelled);
  travelled = 0;
  dest = [e.lngLat.lng, e.lngLat.lat];
  destMarker.setLngLat(dest);
  puck.setLngLat(start);
  map.getSource('route-done').setData({ type: 'FeatureCollection', features: [] });
  driveBtn.textContent = '▶ Simula guida';
  loadRoute();
});

map.on('load', () => {
  map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('route-done', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  // Il percorso sta sotto gli edifici 3D? No: lo mettiamo sopra le strade ma sotto le etichette
  const before = 'building-3d';
  map.addLayer({ id: 'route-glow', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ff5fd2', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 8, 18, 34], 'line-blur': 10, 'line-opacity': 0.55 } }, before);
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ff8ee0', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 18, 18] } }, before);
  map.addLayer({ id: 'route-core', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffc6f0', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1, 18, 6] } }, before);
  map.addLayer({ id: 'route-done-line', type: 'line', source: 'route-done', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#7b74b8', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 18, 18] } }, before);
  loadRoute();
});
</script>
</body>
